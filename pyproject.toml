[project]
name = "wynik"
version = "0.1.0"
description = "Aplicación de práctica musical con reconocimiento en tiempo real"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kivy>=2.3.1",
    "kivymd>=2.0.0",
    "numpy>=2.5.3",
    "sounddevice>=0.5.6",
    "music21>=10.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [".venv", "venv", ".git", ".aider*"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".venv",
    "venv",
    ".git",
    "__pycache__",
    "graphify-out",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402", "E501"]
